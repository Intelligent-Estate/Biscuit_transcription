[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "biscuit-transcription"
version = "0.1.0"
description = "Windows-first dictation overlay with local transcription support."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.2.1",
    "huggingface-hub>=1.20.1",
    "numpy>=2.2.6",
    "pillow>=12.2.0",
    "pyaudio>=0.2.14",
    "pystray>=0.19.5",
    "sounddevice>=0.5.5",
]

[project.scripts]
biscuit = "biscuit.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
